name: Verify C# course exercises
on:
  push:
    branches: [main]
    paths:
      - 'freecodecamp/csharp/**'
      - '.github/workflows/check-freecodecamp-csharp.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build freecodecamp/csharp/CourseLabs.csproj --nologo
      - run: python3 freecodecamp/csharp/verify.py "$(command -v dotnet)"
