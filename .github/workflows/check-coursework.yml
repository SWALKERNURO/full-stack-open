name: Check coursework
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/phonebook_test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/bloglist_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint --workspace=part3/phonebook
      - run: npm test
      - run: npm run lint --workspace=part4/bloglist
      - run: npm test --workspace=part4/bloglist
      - run: npm run lint --workspace=part5/bloglist
      - run: npx playwright install --with-deps chromium
      - run: npm test --workspace=part5/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            part5/e2e/playwright-report/
            part5/e2e/test-results/
          retention-days: 7
