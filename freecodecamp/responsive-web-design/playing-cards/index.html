<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Deck</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><p class="eyebrow">A small study in flexbox</p><h1>The Midnight Deck</h1><p>Three cards. One balanced hand.</p></header>
<main id="playing-cards" aria-label="A collection of three playing cards">
<div class="card" role="img" aria-label="Ace of spades"><div class="left">A<br>♠</div><div class="middle"><span>♠</span></div><div class="right">A<br>♠</div></div>
<div class="card red" role="img" aria-label="Two of hearts"><div class="left">2<br>♥</div><div class="middle"><span>♥</span><span>♥</span></div><div class="right">2<br>♥</div></div>
<div class="card" role="img" aria-label="Three of clubs"><div class="left">3<br>♣</div><div class="middle"><span>♣</span><span>♣</span><span>♣</span></div><div class="right">3<br>♣</div></div>
</main>
<footer>Designed with flexible layouts and a little room to breathe.</footer>
</body>
</html>
