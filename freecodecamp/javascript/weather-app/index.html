<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Window Seat — City Weather</title><link rel="stylesheet" href="styles.css"></head><body><main><p class="eyebrow">WINDOW SEAT / A LOOK OUTSIDE</p><h1>How's the sky?</h1><p class="intro">Pick a city and check the conditions before you head out.</p><div class="controls"><label for="city">Choose a city</label><div class="control-row"><select id="city"><option value=""></option><option value="new york">New York</option><option value="los angeles">Los Angeles</option><option value="chicago">Chicago</option><option value="paris">Paris</option><option value="tokyo">Tokyo</option><option value="london">London</option></select><button id="get-weather-btn" type="button">Check weather</button></div></div><p id="request-status" role="status" aria-live="polite"></p><section id="weather-card" aria-label="Current conditions" hidden><div class="weather-heading"><div><h2 id="location">—</h2><p id="weather-main">—</p></div><img id="weather-icon" alt="Weather icon" width="80" height="80"></div><p class="temperature"><span id="main-temperature">—</span><span class="unit"> °C</span></p><dl><div><dt>Feels like · °C</dt><dd id="feels-like">—</dd></div><div><dt>Humidity · %</dt><dd id="humidity">—</dd></div><div><dt>Wind · m/s</dt><dd id="wind">—</dd></div><div><dt>Gusts · m/s</dt><dd id="wind-gust">—</dd></div></dl></section><footer>Weather data from freeCodeCamp's weather API.<br>Temperatures in Celsius. Wind speed in meters per second.</footer></main><script src="script.js"></script></body></html>
