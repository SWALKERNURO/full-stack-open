<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pocket Beats</title><link rel="stylesheet" href="styles.css"><script src="script.js" defer></script></head><body><div id="drum-machine"><p class="eyebrow">POCKET BEATS / RHYTHM IN YOUR HANDS</p><h1>Find your beat.</h1><p class="intro">Tap a pad or use the keys on your keyboard.</p><div id="pad-bank"><button type="button" class="drum-pad" id="heater-1" aria-label="Heater 1 (Q)">Q<audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="heater-2" aria-label="Heater 2 (W)">W<audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="heater-3" aria-label="Heater 3 (E)">E<audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="heater-4" aria-label="Heater 4 (A)">A<audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="clap" aria-label="Clap (S)">S<audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="open-hi-hat" aria-label="Open Hi-Hat (D)">D<audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="kick-and-hat" aria-label="Kick and Hat (Z)">Z<audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="kick" aria-label="Kick (X)">X<audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3" preload="auto"></audio></button><button type="button" class="drum-pad" id="closed-hi-hat" aria-label="Closed Hi-Hat (C)">C<audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3" preload="auto"></audio></button></div><p id="display" role="status" aria-live="polite">Ready to play</p><p class="hint">Q W E · A S D · Z X C</p></div></body></html>
