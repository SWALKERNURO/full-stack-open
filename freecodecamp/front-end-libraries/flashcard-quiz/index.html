<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recall — Flashcards</title><link rel="stylesheet" href="styles.css"></head><body><main><p class="eyebrow">RECALL / ONE SMALL IDEA AT A TIME</p><h1>Make it memorable.</h1><p class="intro">Tap the card to reveal the answer. Build a little deck of your own.</p><button type="button" id="flashcard" aria-label="Flip flashcard"><span class="front" id="question"></span><span class="back" id="answer"></span></button><div class="deck-controls"><button id="previous-btn" type="button">Previous</button><span id="card-count" role="status"></span><button id="next-btn" type="button">Next</button></div><button id="delete-btn" type="button">Delete current card</button><form id="entry-form" novalidate><h2>Add a card</h2><label for="front-text">Question</label><textarea id="front-text" rows="2" placeholder="What do you want to remember?"></textarea><label for="back-text">Answer</label><textarea id="back-text" rows="2" placeholder="Write the answer here."></textarea><p id="form-error" role="alert"></p><button type="submit">Add to deck</button></form><footer>Saved in this browser. Your cards stay on this device.</footer></main><script src="index.ts"></script></body></html>
